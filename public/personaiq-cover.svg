<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">PersonaIQ — AI Digital Twin &amp; Portfolio Intelligence</title>
  <desc id="desc">A clean blue and white project cover with an abstract digital twin profile, knowledge graph, and portfolio intelligence cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.58" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#dce8ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f53ff"/>
      <stop offset="1" stop-color="#6f7cff"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a31"/>
      <stop offset="1" stop-color="#142a56"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#244ee8" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="800" rx="38" fill="url(#bg)"/>
