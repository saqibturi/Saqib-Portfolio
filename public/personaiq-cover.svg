    <text x="4" y="378" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="800" fill="#101d34">Your next move.</text>

    <text x="4" y="431" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#66748b">RAG knowledge • semantic memory • recruiter intelligence</text>

