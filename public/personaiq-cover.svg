    <text x="4" y="152" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#101d34">AI Digital Twin &amp; Portfolio Intelligence</text>
    <text x="4" y="194" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="5" fill="#61708b">YOUR PROFESSIONAL INTELLIGENCE, ALIVE.</text>

